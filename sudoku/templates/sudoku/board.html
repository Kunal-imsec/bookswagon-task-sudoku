{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <link rel="stylesheet" href="{% static 'sudoku/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sudoku</h1>
            <div class="controls">
                <div class="difficulty-selector">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="Easy" {% if difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Medium" {% if difficulty == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="Hard" {% if difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                    <button id="new-game-btn">New Game</button>
                </div>
                <div class="timer">
                    <span>Time: </span><span id="timer">00:00</span>
                </div>
                <div class="buttons">
                    <button id="check-btn">Check</button>
                    <button id="hint-btn">Hint</button>
                    <button id="solve-btn">Solve</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </div>
        </header>

        <main>
            <div id="sudoku-board">
                <!-- Board will be generated by JavaScript -->
            </div>
            <div id="message-box" class="hidden">
                <p id="message-text"></p>
                <button id="ok-btn">OK</button>
            </div>
        </main>
    </div>

    <script src="{% static 'sudoku/script.js' %}"></script>
</body>
</html>
